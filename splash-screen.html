<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Where in World - Splash Screen</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
        href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Inter:wght@400;600;800&amp;display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#000000",
                        "mint-light": "#6EE7B7",
                        "mint-dark": "#34D399",
                        "coral-light": "#FF8A80",
                        "coral-dark": "#EF5350",
                        "background-light": "#F3F4F6",
                        "background-dark": "#111827",
                    },
                    fontFamily: {
                        display: ['"Archivo Black"', 'sans-serif'],
                        body: ['"Inter"', 'sans-serif'],
                    },
                    borderRadius: {
                        DEFAULT: "0.5rem",
                    },
                },
            },
        };
    </script>
    <style>
        .wave-shape {
            position: absolute;
            left: 0;
            width: 100%;
            background-repeat: no-repeat;
            background-size: cover;
        }

        .text-outline {
            -webkit-text-stroke: 1px black;
        }
    </style>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body
    class="bg-background-light dark:bg-background-dark flex items-center justify-center min-h-screen font-body selection:bg-mint-light selection:text-black">
    <div
        class="relative w-full max-w-md h-[844px] bg-background-light dark:bg-background-dark shadow-2xl overflow-hidden sm:rounded-[3rem] border-8 border-gray-900/10 dark:border-gray-800">
        <!-- Status Bar -->
        <div
            class="absolute top-0 w-full h-12 z-50 flex justify-between items-end px-6 pb-2 text-black dark:text-white mix-blend-difference opacity-80 pointer-events-none">
            <span class="text-xs font-semibold">9:41</span>
            <div class="flex gap-1.5">
                <span class="material-icons-round text-sm">signal_cellular_alt</span>
                <span class="material-icons-round text-sm">wifi</span>
                <span class="material-icons-round text-sm">battery_full</span>
            </div>
        </div>

        <!-- Background Layers -->
        <div class="absolute inset-0 bg-mint-light dark:bg-mint-dark z-0 transition-colors duration-500"></div>
        <div
            class="absolute top-[-10%] left-0 w-full h-[60%] z-0 text-coral-light dark:text-coral-dark transition-colors duration-500">
            <svg class="w-full h-full" fill="currentColor" preserveAspectRatio="none" viewBox="0 0 375 500">
                <path d="M0 0H375V350C375 350 300 420 220 380C140 340 80 440 0 400V0Z"></path>
            </svg>
        </div>
        <div
            class="absolute top-[20%] left-[-20%] w-[140%] h-[30%] z-0 text-mint-light dark:text-mint-dark opacity-90 transition-colors duration-500 transform -rotate-6">
            <svg class="w-full h-full" fill="currentColor" preserveAspectRatio="none" viewBox="0 0 500 200">
                <path d="M0 50C150 150 350 0 500 100V200H0V50Z"></path>
            </svg>
        </div>
        <div
            class="absolute bottom-0 left-0 w-full h-[50%] z-0 text-coral-light dark:text-coral-dark transition-colors duration-500">
            <svg class="w-full h-full" fill="currentColor" preserveAspectRatio="none" viewBox="0 0 375 400">
                <path d="M0 400V100C50 150 150 20 250 80C350 140 375 50 375 50V400H0Z"></path>
            </svg>
        </div>
        <div
            class="absolute bottom-[-5%] right-0 w-[120%] h-[25%] z-0 text-mint-light dark:text-mint-dark transform rotate-3 transition-colors duration-500">
            <svg class="w-full h-full" fill="currentColor" preserveAspectRatio="none" viewBox="0 0 500 150">
                <path d="M0 100C100 0 300 150 500 50V150H0V100Z"></path>
            </svg>
        </div>

        <!-- Main Content -->
        <div class="relative z-10 flex flex-col items-center justify-between h-full pt-28 pb-16 px-6">
            <div class="flex flex-col items-center justify-center space-y-8 mt-10">
                <!-- Planet -->
                <div class="relative w-32 h-32 md:w-40 md:h-40 flex items-center justify-center">
                    <!-- Black planet sphere -->
                    <div
                        class="absolute w-full h-full bg-black rounded-full border-4 border-white shadow-xl dark:border-gray-200">
                    </div>
                    <!-- Orbit ring around planet -->
                    <div
                        class="absolute w-[140%] h-[40%] border-[6px] border-white dark:border-gray-200 rounded-[100%] top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 -rotate-12 bg-transparent z-20">
                    </div>
                    <!-- Top hemisphere overlay for 3D effect -->
                    <div class="absolute w-full h-1/2 bg-black top-0 rounded-t-full z-10"
                        style="clip-path: polygon(0 0, 100% 0, 100% 80%, 0 80%);"></div>
                </div>

                <!-- App Title -->
                <div class="text-center transform -rotate-2">
                    <h1
                        class="font-display italic text-5xl leading-[0.9] tracking-tighter text-black mix-blend-hard-light drop-shadow-sm">
                        WHERE<br />
                        IN<br />
                        WORLD
                    </h1>
                </div>
            </div>

            <!-- Subtitle -->
            <div class="w-full flex flex-col items-center space-y-4 mb-8">
                <p class="text-lg font-bold text-black tracking-[0.25em] uppercase">
                    See friends by City
                </p>
                <p class="text-xs font-bold text-black opacity-60 tracking-widest uppercase mt-4">
                    EST. 2025
                </p>
            </div>
        </div>

        <!-- Noise overlay -->
        <div class="absolute inset-0 pointer-events-none opacity-[0.04] z-20"
            style="background-image: url('data:image/svg+xml,%3Csvg width=\'200\' height=\'200\' viewBox=\'0 0 200 200\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cfilter id=\'noiseFilter\'%3E%3CfeTurbulence type=\'fractalNoise\' baseFrequency=\'0.65\' numOctaves=\'3\' stitchTiles=\'stitch\'/%3E%3C/filter%3E%3Crect width=\'100%25\' height=\'100%25\' filter=\'url(%23noiseFilter)\'/%3E%3C/svg%3E');">
        </div>
    </div>

</body>

</html>
