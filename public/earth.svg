<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="earthGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4da6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3a5f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="landGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a0e8af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4caf50;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Ocean -->
  <circle cx="50" cy="50" r="45" fill="url(#earthGrad)" stroke="#000" stroke-width="3"/>
  <!-- Continents (stylized) -->
  <ellipse cx="35" cy="35" rx="15" ry="12" fill="url(#landGrad)" transform="rotate(-15 35 35)"/>
  <ellipse cx="60" cy="55" rx="18" ry="10" fill="url(#landGrad)" transform="rotate(10 60 55)"/>
  <ellipse cx="30" cy="60" rx="8" ry="12" fill="url(#landGrad)" transform="rotate(-5 30 60)"/>
  <ellipse cx="70" cy="35" rx="10" ry="8" fill="url(#landGrad)" transform="rotate(20 70 35)"/>
  <!-- Highlight -->
  <ellipse cx="35" cy="30" rx="12" ry="8" fill="rgba(255,255,255,0.3)" transform="rotate(-30 35 30)"/>
</svg>
